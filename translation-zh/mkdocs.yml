site_name: SLAM Handbook 中文翻译
site_description: SLAM Handbook 第 1、2 章中文翻译、LaTeX 源码与 PDF
site_url: https://sonder4.github.io/slam-handbook-public-release/
docs_dir: site-docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 第 1 章：SLAM 的因子图: chapter-1.md
  - 第 2 章：高级状态变量表示: chapter-2.md
  - 中英对照阅读:
      - 第 1 章: parallel-chapter-1.md
      - 第 2 章: parallel-chapter-2.md
  - English original:
      - Chapter 1: original-chapter-1.md
      - Chapter 2: original-chapter-2.md

plugins:
  - search

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.saneheaders
  - toc:
      permalink: true

extra_javascript:
  - javascripts/sidebar-controls.js
  - javascripts/parallel-reader.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

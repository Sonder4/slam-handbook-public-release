site_name: SLAM Handbook 中文翻译
site_description: SLAM Handbook 已审查中文翻译、LaTeX 源码与 PDF
site_url: https://sonder4.github.io/slam-handbook-public-release/
docs_dir: site-docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 第 1 章：SLAM 的因子图: chapter-1.md
  - 第 2 章：高级状态变量表示: chapter-2.md
  - 第 3 章：对错误数据关联和离群值的鲁棒性: chapter-3.md
  - 第 4 章：可微优化: chapter-4.md
  - 第 5 章：稠密地图表示: chapter-5.md
  - 第 6 章：可认证最优求解器与 SLAM 的理论性质: chapter-6.md
  - 第 7 章：视觉 SLAM: chapter-7.md
  - 第 8 章：LiDAR SLAM: chapter-8.md
  - 第 9 章：雷达 SLAM: chapter-9.md
  - 第 10 章：事件相机 SLAM: chapter-10.md
  - 第 11 章：SLAM 的惯性里程计: chapter-11.md
  - 第 12 章：腿式里程计: chapter-12.md
  - 第 13 章：用深度学习增强 SLAM: chapter-13.md
  - 第 14 章：可微体渲染的地图表示: chapter-14.md
  - 第 15 章：动态与可变形 SLAM: chapter-15.md
  - 第 16 章：度量--语义 SLAM: chapter-16.md
  - 第 17 章：迈向开放世界空间智能: chapter-17.md
  - 第 18 章：空间智能系统的计算结构: chapter-18.md
  - English original:
      - Chapter 1: original-chapter-1.md
      - Chapter 2: original-chapter-2.md
      - Chapter 3: original-chapter-3.md
      - Chapter 4: original-chapter-4.md
      - Chapter 5: original-chapter-5.md
      - Chapter 6: original-chapter-6.md
      - Chapter 7: original-chapter-7.md
      - Chapter 8: original-chapter-8.md
      - Chapter 9: original-chapter-9.md
      - Chapter 10: original-chapter-10.md
      - Chapter 11: original-chapter-11.md
      - Chapter 12: original-chapter-12.md
      - Chapter 13: original-chapter-13.md
      - Chapter 14: original-chapter-14.md
      - Chapter 15: original-chapter-15.md
      - Chapter 16: original-chapter-16.md
      - Chapter 17: original-chapter-17.md
      - Chapter 18: original-chapter-18.md

plugins:
  - search

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.saneheaders
  - toc:
      permalink: true

extra_javascript:
  - javascripts/sidebar-controls.js
  - javascripts/parallel-reader.js
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-chtml-full.js

extra_css:
  - stylesheets/extra.css
